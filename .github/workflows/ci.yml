name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Pytest
        run: pytest -v --cov=decommission --cov-report=term-missing

      - name: Dry-run smoke test against example inventory
        run: |
          python -m decommission.cli --inventory examples/services.example.yaml list
          python -m decommission.cli --inventory examples/services.example.yaml run payments
