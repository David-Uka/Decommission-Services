name: Decommission Service

# Manually-triggered runbook that retires a service end-to-end:
# inventory check -> traffic drain -> log archive -> DB snapshot ->
# registry/DNS/monitoring cleanup -> infra teardown.
#
# Safety model:
#   1. `check_inventory` refuses to run against any service not listed in
#      services.yaml (typo/wrong-target guard).
#   2. The `k8s-cleanup` and `terraform-destroy` jobs run under the
#      `decommission-approval` GitHub Environment. Configure that
#      environment in Settings > Environments with required reviewers —
#      that's the real manual gate (a job condition can't provide one on
#      its own, GitHub will pause the run for sign-off before these jobs
#      execute).
on:
  workflow_dispatch:
    inputs:
      service_name:
        description: 'Name of the service to decommission (must exist in services.yaml)'
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SERVICE_NAME: ${{ github.event.inputs.service_name }}
    steps:
      - uses: actions/checkout@v3

      - name: Validate service is in inventory
        run: ./scripts/check_inventory.sh "$SERVICE_NAME"

  k8s-cleanup:
    needs: validate
    runs-on: ubuntu-latest
    environment: decommission-approval
    env:
      SERVICE_NAME: ${{ github.event.inputs.service_name }}
    steps:
      - uses: actions/checkout@v3

      - name: Drain Traffic
        run: ./scripts/drain_traffic.sh "$SERVICE_NAME"

      - name: Archive Logs
        run: ./scripts/archive_logs.sh "$SERVICE_NAME"

      - name: Snapshot DB
        run: ./scripts/snapshot_db.sh "$SERVICE_NAME"

      - name: Clean Registry
        run: ./scripts/remove_from_service_registry.sh "$SERVICE_NAME"

      - name: Clean DNS
        run: ./scripts/remove_dns.sh "$SERVICE_NAME"

      - name: Clean Monitoring
        run: ./scripts/clean_monitoring.sh "$SERVICE_NAME"

  terraform-destroy:
    needs: validate
    runs-on: ubuntu-latest
    environment: decommission-approval
    env:
      SERVICE_NAME: ${{ github.event.inputs.service_name }}
    steps:
      - uses: actions/checkout@v3

      - name: Check for per-service Terraform stack
        id: check
        run: |
          if [[ -d "infra/services/$SERVICE_NAME" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No infra/services/$SERVICE_NAME stack in this repo — skipping terraform destroy."
          fi

      - name: Setup Terraform
        if: steps.check.outputs.found == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Destroy Infrastructure
        if: steps.check.outputs.found == 'true'
        working-directory: infra/services/${{ github.event.inputs.service_name }}
        run: |
          terraform init -input=false
          terraform destroy -auto-approve

  notify:
    needs: [k8s-cleanup, terraform-destroy]
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ github.event.inputs.service_name }} decommission complete."
